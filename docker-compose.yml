services:
  postgres:
    image: postgres:17
    container_name: team-leave-calendar-postgres
    environment:
      POSTGRES_DB: team_leave_calendar
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
